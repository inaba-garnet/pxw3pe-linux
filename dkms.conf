PACKAGE_NAME="pxw3pe"
PACKAGE_VERSION="1.0"

# DKMS appends KERNELRELEASE=... to MAKE, which would trip the Makefile's
# kbuild-detection branch (no default target). Invoke kbuild directly instead.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="pxw3pe"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTO_INSTALL="yes"
